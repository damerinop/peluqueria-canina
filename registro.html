<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - CanHappy</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>CanHappy Grooming</h1>
        <nav><a href="index.html">Inicio</a></nav>
    </header>

    <main class="container">
        <form onsubmit="return validarRegistro(event)" style="max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px;">
            <h3>Registro de Usuario</h3>
            <br>
            <label for="run">RUN (sin puntos ni guión):</label><br>
            <input type="text" id="run" maxlength="9" placeholder="19011022K" required style="width: 100%; padding: 8px; margin-top: 5px;"><br><br>

            <label for="nombre">Nombre Completo:</label><br>
            <input type="text" id="nombre" required style="width: 100%; padding: 8px; margin-top: 5px;"><br><br>

            <label for="region">Región:</label><br>
            <select id="region" onchange="cargarComunas()" required style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="">Seleccione una región</option>
                <option value="metropolitana">Región Metropolitana</option>
                <option value="valparaiso">Valparaíso</option>
            </select><br><br>

            <label for="comuna">Comuna:</label><br>
            <select id="comuna" required style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="">Seleccione primero una región</option>
            </select><br><br>

            <button type="submit" style="width: 100%;">Registrarse</button>
        </form>
    </main>

    <script src="js/validaciones.js"></script>
</body>
</html>
