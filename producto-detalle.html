<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Servicio - CanHappy</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>CanHappy Grooming</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="container">
        <div style="display: flex; gap: 30px; margin-top: 20px; flex-wrap: wrap;">
            <img src="img/bano-corte.jpg" alt="Corte de Pelo y Baño" style="border-radius: 8px;">
            
            <div style="max-width: 500px;">
                <h2>Corte de Pelo y Baño Completo</h2>
                <p style="font-size: 1.5rem; color: #27ae60; font-weight: bold;">$18.000</p>
                <p style="margin: 15px 0;">Incluye cepillado, lavado con shampoo neutro e hipoalergénico, secado profesional, corte de pelo según la raza y perfume canino especial.</p>
                
                <label for="cantidad">Cantidad de mascotas:</label>
                <input type="number" id="cantidad" value="1" min="1" max="5" style="padding: 5px; width: 60px;">
                <br><br>
                <button type="button">Añadir al Carrito</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Peluquería Canina CanHappy</p>
    </footer>
